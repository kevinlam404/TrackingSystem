camera:
  source: webcam #picamera when used 
  device: 0
  width: 640
  height: 480
  fps: 30

detector:
  model_path: models/yolo26n_ncnn_model
  image_size: 320
  confidence: 0.1
  tracker_config: config/bytetrack_optimize.yaml

behavior: 
  target_label: person
  acquisition_frames: 3
  lost_timeout_seconds: 1.0
  scan_pan_speed: 0.15

control:
  dead_zone: 0.05
  maximum_pan_speed: 0.4
  minimum_pan_speed: 0.08
  tilt_speed_dps: 45.0
  stale_frame_timeout_seconds: 0.5

gimbal:
  tilt_min_degrees: -60.0
  tilt_max_degrees: 60.0

  pca9685:
    pan_channel: 0
    tilt_channel: 1
    pan_reversed: false
    tilt_reversed: false
    #continous mg9996r
    pan_stop_pulse_us: 1500
    pan_min_pulse_us: 1000
    pan_max_pulse_us: 2000
    #s51
    tilt_min_pulse_us: 1000
    tilt_max_pulse_us: 2000
    
  
    

interface:
  window_name: Tracking system
  show_all_boxes_when_unlocked: true
  show_fps: true
  show_control_values: true

